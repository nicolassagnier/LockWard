<div class="llista">
    <app-barra-cerca
        (cercaCanviada)="onCerca($event)">
    </app-barra-cerca>

    <app-targeta-element
        *ngFor="let element of elementsFiltrats; trackBy: trackById"
        [element]="element">
    </app-targeta-element>

    <p *ngIf="elementsFiltrats.length === 0">
        No s'han trobat credencials.
    </p>
</div>
